，用一季出现鼓包或慢漏；阀门做工粗，闭合后仍缓慢漏气","gap":"保温结构（反射膜/开孔泡棉层数与内胆复合工艺）和阀门/接缝的气密工艺；R 值是最好虚标的参数","domestic_examples":["国产户外品牌（浙江、江苏产）","电商白牌"],"verdict":"depends","verify":"充满气放置一夜，早上按压看是否变软（慢漏）；把垫子放在凉地面躺 10 分钟，感受背部是否发凉（比标称更凉说明保温虚标）；反复开闭阀门看密封圈是否变形；看气室隔条是否均匀；用指甲轻划面料看是否留痕","aliases":["防潮垫","充气垫","蛋槽垫","睡垫","sleeping pad"]},{"id":"vacuum_flask","item":"保温壶（真空不锈钢保温瓶）","category":"户外运动","bar":["日本 ZOJIRUSHI 象印","日本 TIGER 虎牌"],"origin_company":"日本 Zojirushi 象印魔法瓶 / 日本 Tiger 虎牌魔法瓶","origin_traits":"真空层抽真空度高，开水放数小时温度衰减慢、瓶身不烫手；杯盖密封圈配合精细，倒置不漏；内胆电解抛光，长期装茶不留垢、不串味","domestic_traits":"国产头部（哈尔斯、富光一类，本身也为国际品牌代工）保温性能已很接近，日常通勤够用；但白牌真空度不稳，个别批次几小时就凉；密封圈材料差，一两年发硬变形漏水；内胆抛光粗糙，装茶后留垢","gap":"抽真空工艺稳定性与密封圈材质；保温结构本身国产已掌握，差距集中在低价批次的品控与密封件老化","domestic_examples":["国产保温杯品牌（浙江永康、江苏产）","电商白牌（浙江永康产）"],"verdict":"domestic_ok","verify":"装 95℃ 左右热水，4 小时后测温度（一般仍应烫口），同时摸瓶身外壁（发烫说明真空层失效）；倒置晃一分钟看是否渗漏；拧开盖看密封圈是否软弹无异味；看内胆是否电解抛光（发亮镜面优于灰哑）；看瓶口焊缝是否平齐","aliases":["保温壶","保温杯","真空保温瓶","thermos"]},{"id":"folding_camp_chair","item":"折叠椅（露营椅/克米特椅）","category":"户外运动","bar":["韩国 Helinox","美国 GCI Outdoor"],"origin_company":"韩国 Helinox（DAC 铝杆）/ 美国 GCI Outdoor","origin_traits":"铝杆为高等级 DAC 或同级铝材，同承重下明显轻；关节与连接件为金属内衬，反复开合不松；布面张力均匀，久坐不塌腰","domestic_traits":"国产折叠椅产业链成熟、性价比高，普通露营完全够用；但低价款铝杆壁薄，坐久了杆件弯、连接处松；布面缝合张力不匀，坐上去偏向一侧；塑料关节在低温下变脆","gap":"铝杆牌号壁厚与连接件结构（金属内衬 vs 纯塑料），以及面料张力控制；轻量化差在管材与模具精度","domestic_examples":["国产户外家具品牌（浙江、江苏产）","电商白牌（浙江产）"],"verdict":"domestic_ok","verify":"坐上去左右挪动，听关节有无咯吱与松动；看连接处内衬是金属还是纯塑料；看铝杆切口壁厚与表面阳极处理；掂重量对比同承重款式；看布面缝合是否对称、坐上去是否明显偏；收折几次看铰链是否变松","aliases":["折叠椅","露营椅","克米特椅","月亮椅","camp chair"]},{"id":"quick_dry_shirt","item":"速干衣（速干 T 恤）","category":"户外运动","bar":["日本 mont-bell","美国 Columbia 哥伦比亚"],"origin_company":"日本 mont-bell / 美国 Columbia Sportswear","origin_traits":"多为异形截面聚酯纤维，导湿快、干得快；抗起球与抗 UV 处理稳定，洗多次不变形；版型与缝线位置避开设磨点，背包肩带下不易磨破","domestic_traits":"国产品牌速干衣供应链成熟、价格低，日常跑步健身够用；但低价款用普通涤纶平纹，出汗后贴身发凉、干得慢；抗起球差，洗几次起毛球；标 UPF 但无实测支撑","gap":"纤维截面与织法（导湿结构）以及后整理（抗起球、抗 UV）工艺；普通涤纶与功能面料成本差不大，但染整工序差别明显","domestic_examples":["国产运动/户外品牌（福建、浙 <script>
(function(){
  var DB = JSON.parse(document.getElementById('DATA').textContent);
  var list = document.getElementById('list'), chips = document.getElementById('chips'), vchips = document.getElementById('vchips'),
      q = document.getElementById('q'), hint = document.getElementById('hint'), clearBtn = document.getElementById('clear');
  var items = DB.items || [], cat = '全部', vd = '全部', page = 1;

  document.getElementById('title').textContent = (DB.meta.title || '') || document.title;
  document.getElementById('foot').textContent = (DB.meta.disclaimer || '') + ' ｜ 数据更新：' + (DB.meta.updated || '');
  document.getElementById('n1').textContent = items.length;
  document.getElementById('n3').textContent = items.filter(function(d){return d.verdict==='import';}).length;

  var ORDER = ['胶粘密封','五金工具','电动工具耗材','电子电工','家装五金','厨房用品','清洁洗护','文具办公','汽车养护','户外运动'];
  var cats = ['全部'];
  ORDER.forEach(function(c){ if(items.some(function(d){return d.category===c;})) cats.push(c); });
  items.forEach(function(d){ if(d.category && cats.indexOf(d.category)<0) cats.push(d.category); });
  document.getElementById('n2').textContent = cats.length - 1;

  cats.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip' + (c===cat?' on':'');
    b.textContent = c === '全部' ? '全部 ' + items.length : c;
    b.onclick = function(){ cat = c; page = 1;
      [].forEach.call(chips.children, function(x){ x.classList.toggle('on', x===b); }); render(); };
    chips.appendChild(b);
  });

  var VOPTS = [['全部','全部结论'],['import','⚠️ 建议买原厂'],['depends','🤔 看规格'],['domestic_ok','✅ 国产够用']];
  VOPTS.forEach(function(v){
    var b = document.createElement('button');
    b.className = 'chip v' + (v[0]===vd?' on':'');
    b.textContent = v[1];
    b.onclick = function(){ vd = v[0]; page = 1;
      [].forEach.call(vchips.children, function(x){ x.classList.toggle('on', x===b); }); render(); };
    vchips.appendChild(b);
  });

  var VL = {import:'建议买原厂', depends:'看规格', domestic_ok:'国产够用'};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  function hl(s, kw){
    var t = esc(s); if(!kw) return t;
    try{ var k = esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      return t.replace(new RegExp('('+k+')','gi'), '<mark>$1</mark>'); }catch(e){ return t; }
  }
  function hay(d){
    return [d.item,d.category,(d.bar||[]).join(' '),d.origin_company,d.origin_traits,d.domestic_traits,d.gap,
      (d.domestic_examples||[]).join(' '),(d.aliases||[]).join(' ')].join(' ').toLowerCase();
  }

  function render(){
    var kw = q.value.trim();
    if (window.__kw !== kw) { page = 1; window.__kw = kw; }
    clearBtn.style.display = kw ? 'block' : 'none';
    var kws = kw.toLowerCase().split(/\s+/).filter(Boolean);
    var rows = items.filter(function(d){
      if(cat !== '全部' && d.category !== cat) return false;
      if(vd !== '全部' && d.verdict !== vd) return false;
      if(!kws.length) return true;
      var h = hay(d);
      return kws.every(function(k){ return h.indexOf(k) >= 0; });
    });
    hint.textContent = (kw||cat!=='全部'||vd!=='全部') ? '共 ' + rows.length + ' 条结果' : '全部 ' + rows.length + ' 条，可点分类与结论筛选';
    if(!rows.length){
      list.innerHTML = '<div class="empty">没有找到匹配的品类<br>试试「纳米胶」「批头」「生料带」或品牌名</div>'; return;
    }
    var shown = rows.slice(0, page * 40);
    list.innerHTML = shown.map(function(d){
      var dom = (d.domestic_examples||[]).length
        ? '<dt>国产参考</dt><dd class="dom">' + d.domestic_examples.map(function(x){return '<span>'+hl(x,kw)+'</span>';}).join('') + '</dd>' : '';
      return '<article class="card v-'+esc(d.verdict)+'">'
        + '<div class="top"><div class="item">'+hl(d.item,kw)+'</div><span class="vb">'+VL[d.verdict]+'</span></div>'
        + '<div class="cat">'+esc(d.category)+'</div>'
        + '<dl class="pair">'
        +   '<dt>原厂</dt><dd class="brand">'+(d.bar||[]).map(function(x){return hl(x,kw);}).join(' / ')
        +     (d.origin_company?'<small>'+hl(d.origin_company,kw)+'</small>':'')+'</dd>'
        +   (d.origin_traits?'<dt>原厂表现</dt><dd>'+hl(d.origin_traits,kw)+'</dd>':'')
        +   (d.domestic_traits?'<dt>国产常见</dt><dd>'+hl(d.domestic_traits,kw)+'</dd>':'')
        +   (d.gap?'<dt>差在哪</dt><dd>'+hl(d.gap,kw)+'</dd>':'')
        +   dom
        +   (d.verify?'<dt>怎么挑</dt><dd class="verify">'+hl(d.verify,kw)+'</dd>':'')
        + '</dl></article>';
    }).join('');
    if (rows.length > shown.length){
      list.innerHTML += '<button id="more" class="more">再显示 ' + Math.min(40, rows.length - shown.length) + ' 条（已显示 ' + shown.length + '/' + rows.length + '）</button>';
      document.getElementById('more').onclick = function(){ page++; render(); };
    }
  }

  var t;
  q.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(render, 80); });
  q.addEventListener('search', render);
  clearBtn.onclick = function(){ q.value=''; render(); q.focus(); };
  render();
})();
</script>
</body>
</html>
