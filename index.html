<script>
(function(){
  var DB = JSON.parse(document.getElementById('DATA').textContent);
  var list = document.getElementById('list'), chips = document.getElementById('chips'),
      q = document.getElementById('q'), hint = document.getElementById('hint'),
      clearBtn = document.getElementById('clear');
  var drugs = DB.drugs || [], cat = '全部';

  document.getElementById('title').textContent = (DB.meta.title || '') || document.title;
  document.getElementById('foot').textContent = (DB.meta.disclaimer || '') + ' ｜ 数据更新：' + (DB.meta.updated || '');
  document.getElementById('n1').textContent = drugs.length;

  var ORDER = ['心血管','糖尿病','抗感染','神经精神','消化系统','呼吸与抗过敏','解热镇痛抗炎','抗病毒','肿瘤靶向','免疫与风湿','泌尿与男科','妇科与激素','眼科与皮肤','其他'];
  var cats = ['全部'];
  ORDER.forEach(function(c){ if(drugs.some(function(d){return d.category===c;})) cats.push(c); });
  drugs.forEach(function(d){ if(d.category && cats.indexOf(d.category)<0) cats.push(d.category); });
  document.getElementById('n2').textContent = cats.length - 1;

  cats.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip' + (c===cat?' on':'');
    b.textContent = c === '全部' ? '全部 ' + drugs.length : c;
    b.onclick = function(){
      cat = c;
      [].forEach.call(chips.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    chips.appendChild(b);
  });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  function hl(s, kw){
    var t = esc(s);
    if(!kw) return t;
    try{
      var k = esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      return t.replace(new RegExp('('+k+')','gi'), '<mark>$1</mark>');
    }catch(e){ return t; }
  }
  function hay(d){
    return [d.generic, d.origin_brand, d.origin_brand_en, d.origin_company, d.note,
            (d.domestic_examples||[]).join(' '), (d.aliases||[]).join(' '), d.category].join(' ').toLowerCase();
  }

  function render(){
    var kw = q.value.trim();
    clearBtn.style.display = kw ? 'block' : 'none';
    var kws = kw.toLowerCase().split(/\s+/).filter(Boolean);
    var rows = drugs.filter(function(d){
      if(cat !== '全部' && d.category !== cat) return false;
      if(!kws.length) return true;
      var h = hay(d);
      return kws.every(function(k){ return h.indexOf(k) >= 0; });
    });
    hint.textContent = (kw || cat!=='全部') ? '共 ' + rows.length + ' 条结果' : '全部 ' + rows.length + ' 条，可点上方分类筛选';
    if(!rows.length){
      list.innerHTML = '<div class="empty">没有找到匹配的药品<br>试试通用名（如“阿托伐他汀”）或原研商品名（如“立普妥”）</div>';
      return;
    }
    list.innerHTML = rows.map(function(d){
      var dom = (d.domestic_examples||[]).length
        ? '<dd class="dom">' + d.domestic_examples.map(function(x){return '<span>'+hl(x,kw)+'</span>';}).join('') + '</dd>' : '';
      return '<article class="card">'
        + '<div class="top"><div class="generic">'+hl(d.generic,kw)+'</div><span class="tag">'+esc(d.category)+'</span></div>'
        + '<dl class="pair">'
        +   (d.origin_brand
          ? '<dt>原研</dt><dd class="brand">'+hl(d.origin_brand,kw)+(d.origin_brand_en?'<small>'+hl(d.origin_brand_en,kw)+'</small>':'')+'</dd>'
          + '<dt>厂家</dt><dd>'+hl(d.origin_company,kw)+'</dd>'
          : '<dt>原研</dt><dd class="brand muted2">'+(d.domestic_original?'国产原创，无进口原研':'国内无原研品牌在售')+(d.origin_brand_en?'<small>'+hl(d.origin_brand_en,kw)+'</small>':'')+'</dd>')
        +   (dom ? '<dt>国产</dt>' + dom : '')
        + '</dl>'
        + (d.forms && d.forms.length ? '<div class="forms">常见剂型：'+esc(d.forms.join(' / '))+'</div>' : '')
        + (d.note ? '<div class="note">'+hl(d.note,kw)+'</div>' : '')
        + '</article>';
    }).join('');
  }

  var t;
  q.addEventListener('input', function(){ clearTimeout(t); t = setTimeout(render, 80); });
  q.addEventListener('search', render);
  clearBtn.onclick = function(){ q.value=''; render(); q.focus(); };
  render();
})();
</script>
